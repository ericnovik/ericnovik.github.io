<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-labelledby="title desc">
  <title id="title">Projection geometry</title>
  <desc id="desc">A response vector y decomposed into its fitted projection y hat and residual r above the column space of X.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3f61ee"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#eb6859"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#24a18c"/>
    </marker>
    <clipPath id="plane-clip">
      <polygon points="34,230 505,110 690,267 215,387"/>
    </clipPath>
    <filter id="soft-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#233049" flood-opacity="0.16"/>
    </filter>
  </defs>

  <polygon points="34,230 505,110 690,267 215,387" fill="#e6f4f1" fill-opacity="0.82" stroke="#a7cfca" stroke-width="1.2"/>
  <g clip-path="url(#plane-clip)" stroke="#add2ce" stroke-width="1.1" opacity="0.9">
    <line x1="-10" y1="278" x2="525" y2="89"/>
    <line x1="48" y1="323" x2="583" y2="134"/>
    <line x1="108" y1="369" x2="643" y2="180"/>
    <line x1="171" y1="410" x2="706" y2="221"/>
    <line x1="107" y1="186" x2="311" y2="410"/>
    <line x1="205" y1="160" x2="409" y2="384"/>
    <line x1="303" y1="135" x2="507" y2="359"/>
    <line x1="401" y1="110" x2="605" y2="334"/>
    <line x1="499" y1="84" x2="703" y2="308"/>
  </g>

  <g stroke="#9aa5b4" stroke-width="2" opacity="0.9">
    <line x1="358" y1="244" x2="212" y2="270"/>
    <line x1="358" y1="244" x2="596" y2="151"/>
    <line x1="358" y1="244" x2="405" y2="414"/>
  </g>
  <g stroke="#cbd2dc" stroke-width="1.6" stroke-dasharray="8 9" opacity="0.7">
    <line x1="358" y1="244" x2="280" y2="0"/>
    <line x1="358" y1="244" x2="102" y2="354"/>
  </g>

  <line x1="358" y1="244" x2="132" y2="74" stroke="#3f61ee" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="154" y1="286" x2="132" y2="74" stroke="#eb6859" stroke-width="4" marker-end="url(#arrow-red)"/>
  <line x1="358" y1="244" x2="154" y2="286" stroke="#24a18c" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="358" y1="244" x2="461" y2="220" stroke="#24a18c" stroke-width="3.5" marker-end="url(#arrow-green)" opacity="0.65"/>
  <line x1="358" y1="244" x2="407" y2="280" stroke="#24a18c" stroke-width="3.5" marker-end="url(#arrow-green)" opacity="0.85"/>

  <circle cx="358" cy="244" r="7" fill="#f0f1eb" stroke="#8290a3" stroke-width="2"/>
  <text x="347" y="244" fill="#647184" font-family="IBM Plex Sans, sans-serif" font-size="24" font-weight="600">0</text>

  <g filter="url(#soft-shadow)">
    <circle cx="132" cy="74" r="25" fill="#3f61ee" stroke="#ffffff" stroke-width="2"/>
    <circle cx="154" cy="174" r="25" fill="#eb6859" stroke="#ffffff" stroke-width="2"/>
    <circle cx="154" cy="286" r="25" fill="#15947f" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g fill="#ffffff" font-family="Georgia, serif" font-size="25" font-style="italic" font-weight="700" text-anchor="middle">
    <text x="132" y="83">y</text>
    <text x="154" y="183">r</text>
    <text x="154" y="294">ŷ</text>
  </g>

  <g font-family="Georgia, serif" font-size="23" font-style="italic" font-weight="700">
    <text x="455" y="221" fill="#078a73">x</text>
    <text x="404" y="292" fill="#078a73">1</text>
    <text x="203" y="267" fill="#647184">y₁</text>
    <text x="593" y="153" fill="#647184">y₃</text>
  </g>

  <rect x="554" y="239" width="80" height="52" rx="16" fill="#f6fbfa" fill-opacity="0.95" stroke="#c8e5e0" stroke-width="1.5"/>
  <text x="594" y="273" text-anchor="middle" fill="#147d6b" font-family="IBM Plex Sans, sans-serif" font-size="25" font-weight="600">C(X)</text>
</svg>
