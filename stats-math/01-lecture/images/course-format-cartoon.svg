<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Course format cartoon</title>
  <desc id="desc">Black-and-white hand-drawn illustration of two five-day weeks, a three-hour clock, questions, a lecture, hands-on coding, and many small programs.</desc>
  <defs>
    <style>
      .ink{fill:none;stroke:#111;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .thin{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .paper{fill:#fff;stroke:#111;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .shade{fill:#eee;stroke:#111;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .mark{font-family:"Chalkboard SE","Comic Sans MS",sans-serif;font-weight:700;fill:#111;text-anchor:middle}
    </style>
  </defs>
  <rect width="1600" height="850" fill="#fff"/>
  <path class="ink" d="M40 34 Q800 12 1560 34 L1570 810 Q800 836 30 810 Z"/>

  <!-- two-week calendar -->
  <g transform="translate(300 58)">
    <rect class="paper" x="0" y="0" width="720" height="190" rx="28"/>
    <path class="thin" d="M360 18 V172"/>
    <g transform="translate(28 48)">
      <path class="ink" d="M0 0 H304 V112 H0 Z M0 38 H304"/>
      <path class="thin" d="M61 38 V112 M122 38 V112 M183 38 V112 M244 38 V112"/>
      <text class="mark" x="30" y="88" font-size="35">1</text><text class="mark" x="92" y="88" font-size="35">2</text><text class="mark" x="153" y="88" font-size="35">3</text><text class="mark" x="214" y="88" font-size="35">4</text><text class="mark" x="275" y="88" font-size="35">5</text>
    </g>
    <g transform="translate(388 48)">
      <path class="ink" d="M0 0 H304 V112 H0 Z M0 38 H304"/>
      <path class="thin" d="M61 38 V112 M122 38 V112 M183 38 V112 M244 38 V112"/>
      <text class="mark" x="30" y="88" font-size="35">6</text><text class="mark" x="92" y="88" font-size="35">7</text><text class="mark" x="153" y="88" font-size="35">8</text><text class="mark" x="214" y="88" font-size="35">9</text><text class="mark" x="275" y="88" font-size="35">10</text>
    </g>
    <path class="thin" d="M72 22 q12-28 24 0 M250 22 q12-28 24 0 M440 22 q12-28 24 0 M620 22 q12-28 24 0"/>
  </g>

  <!-- clock -->
  <g transform="translate(1190 74)">
    <circle class="paper" cx="92" cy="92" r="82"/>
    <path class="ink" d="M92 92 V38 M92 92 H142"/>
    <circle cx="92" cy="92" r="8" fill="#111"/>
    <text class="mark" x="92" y="205" font-size="38">3h</text>
  </g>

  <!-- teacher character -->
  <g transform="translate(52 190)">
    <circle class="paper" cx="110" cy="78" r="48"/>
    <path class="thin" d="M72 68 q38-54 77-5 M84 81 q12-12 24 0 M122 81 q12-12 24 0 M100 102 q14 12 30 0"/>
    <path class="paper" d="M55 140 Q110 115 166 142 L187 350 H34 Z"/>
    <path class="ink" d="M55 168 L5 265 M166 168 L262 125 M257 124 l-28-10 M257 124 l-14 26"/>
    <path class="thin" d="M76 157 q34 30 69 0 M94 152 v50 M128 152 v50"/>
  </g>

  <!-- three daily blocks -->
  <g transform="translate(300 285)">
    <rect class="paper" x="0" y="0" width="385" height="300" rx="34"/>
    <rect class="paper" x="405" y="0" width="385" height="300" rx="34"/>
    <rect class="paper" x="810" y="0" width="385" height="300" rx="34"/>

    <!-- questions -->
    <g transform="translate(38 38)">
      <circle class="shade" cx="70" cy="155" r="42"/><circle class="paper" cx="175" cy="158" r="42"/><circle class="shade" cx="275" cy="155" r="42"/>
      <path class="thin" d="M26 242 q44-72 88 0 M130 242 q45-72 90 0 M232 242 q45-72 90 0"/>
      <path class="paper" d="M116 18 Q192-12 268 18 V92 Q193 115 125 92 L104 118 110 86 Q88 60 116 18 Z"/>
      <text class="mark" x="191" y="75" font-size="68">?</text>
    </g>

    <!-- lecture -->
    <g transform="translate(430 28)">
      <rect class="paper" x="100" y="18" width="230" height="150" rx="8"/>
      <path class="thin" d="M122 132 q50-100 90-18 t92-42 M130 65 H184 M157 38 V92"/>
      <text class="mark" x="258" y="86" font-size="48">∑</text>
      <circle class="paper" cx="58" cy="108" r="34"/>
      <path class="paper" d="M25 150 Q58 132 92 151 L104 265 H10 Z"/>
      <path class="ink" d="M90 170 L176 111"/>
      <circle class="shade" cx="166" cy="245" r="28"/><circle class="paper" cx="237" cy="245" r="28"/><circle class="shade" cx="306" cy="245" r="28"/>
    </g>

    <!-- hands-on -->
    <g transform="translate(840 38)">
      <circle class="paper" cx="85" cy="92" r="38"/><circle class="shade" cx="255" cy="92" r="38"/>
      <path class="thin" d="M44 205 q40-80 82 0 M214 205 q42-80 84 0"/>
      <path class="paper" d="M18 154 H150 L170 246 H0 Z M188 154 H322 L342 246 H170 Z"/>
      <text class="mark" x="84" y="214" font-size="42">&lt;/&gt;</text><text class="mark" x="255" y="214" font-size="42">R</text>
      <path class="thin" d="M155 272 q25-22 50 0 M142 282 h76"/>
    </g>
  </g>

  <!-- many small programs -->
  <g transform="translate(320 630)">
    <path class="ink" d="M0 70 H92 M72 50 l22 20-22 20"/>
    <g transform="translate(120 0)">
      <rect class="paper" x="0" y="0" width="190" height="120" rx="16"/><rect class="paper" x="210" y="0" width="190" height="120" rx="16"/><rect class="paper" x="420" y="0" width="190" height="120" rx="16"/><rect class="paper" x="630" y="0" width="190" height="120" rx="16"/><rect class="paper" x="840" y="0" width="190" height="120" rx="16"/>
      <path class="thin" d="M18 28 h154 M228 28 h154 M438 28 h154 M648 28 h154 M858 28 h154"/>
      <text class="mark" x="95" y="82" font-size="34">for()</text><text class="mark" x="305" y="82" font-size="34">f(x)</text><text class="mark" x="515" y="82" font-size="34">if()</text><text class="mark" x="725" y="82" font-size="34">Σ</text><text class="mark" x="935" y="82" font-size="34">R</text>
    </g>
  </g>
</svg>
