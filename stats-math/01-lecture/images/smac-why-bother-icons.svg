<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Why statistics, math, and computing matter</title>
  <desc id="desc">Six black-and-white visual transformations connect programming, differentiation, integration, linear algebra, probability, and statistics to experiments, optimization, probability areas, equation systems, samples, and populations.</desc>
  <defs><style>.i{fill:none;stroke:#111;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.p{fill:#fff;stroke:#111;stroke-width:6}.s{fill:#eee;stroke:#111;stroke-width:5}.t{font-family:"Chalkboard SE","Comic Sans MS",sans-serif;font-weight:700;fill:#111;text-anchor:middle}</style></defs>
  <rect width="1500" height="680" fill="#fff"/><path class="i" d="M25 26 Q750 8 1475 26 L1482 654 Q750 676 18 654 Z"/>
  <!-- six transformation panels -->
  <g transform="translate(55 55)">
    <!-- code to experiment -->
    <g><rect class="p" width="430" height="170" rx="28"/><rect class="s" x="28" y="35" width="120" height="95" rx="10"/><text class="t" x="88" y="95" font-size="42">&lt;/&gt;</text><path class="i" d="M165 84 H252 M226 58 l30 26-30 26"/><path class="i" d="M292 45 v35 l-38 63 h135 l-38-63 V45 M304 110 q35 20 70 0"/></g>
    <!-- derivative to optimum -->
    <g transform="translate(460)"><rect class="p" width="430" height="170" rx="28"/><text class="t" x="78" y="102" font-size="48">d/dx</text><path class="i" d="M138 84 H225 M199 58 l30 26-30 26"/><circle class="p" cx="325" cy="84" r="58"/><circle class="s" cx="325" cy="84" r="36"/><circle class="p" cx="325" cy="84" r="13"/><path class="i" d="M374 35 l-49 49 M350 34 h25 v25"/></g>
    <!-- integral to area -->
    <g transform="translate(920)"><rect class="p" width="430" height="170" rx="28"/><text class="t" x="70" y="122" font-size="100">∫</text><path class="i" d="M130 84 H217 M191 58 l30 26-30 26 M250 130 H398 M267 130 C290 130 301 48 326 48 S363 130 390 130"/><path d="M267 130 C290 130 301 48 326 48 S363 130 390 130 Z" fill="#ddd" stroke="#111" stroke-width="4"/></g>
    <!-- matrix to system -->
    <g transform="translate(0 210)"><rect class="p" width="430" height="170" rx="28"/><path class="i" d="M30 35 v100 M135 35 v100 M52 55 h60 M52 85 h60 M52 115 h60"/><text class="t" x="83" y="98" font-size="34">aᵢⱼ</text><path class="i" d="M160 84 H245 M219 58 l30 26-30 26"/><text class="t" x="335" y="102" font-size="54">Xβ=y</text></g>
    <!-- population to sample -->
    <g transform="translate(460 210)"><rect class="p" width="430" height="170" rx="28"/><g fill="#111"><circle cx="48" cy="50" r="8"/><circle cx="80" cy="76" r="8"/><circle cx="112" cy="45" r="8"/><circle cx="58" cy="112" r="8"/><circle cx="104" cy="126" r="8"/><circle cx="135" cy="91" r="8"/></g><path class="i" d="M165 84 H250 M224 58 l30 26-30 26"/><circle class="p" cx="335" cy="84" r="54"/><circle class="s" cx="320" cy="72" r="9"/><circle class="s" cx="350" cy="94" r="9"/><circle class="s" cx="330" cy="112" r="9"/></g>
    <!-- sample to population -->
    <g transform="translate(920 210)"><rect class="p" width="430" height="170" rx="28"/><circle class="p" cx="80" cy="84" r="54"/><circle class="s" cx="65" cy="72" r="9"/><circle class="s" cx="95" cy="94" r="9"/><circle class="s" cx="75" cy="112" r="9"/><path class="i" d="M150 84 H235 M209 58 l30 26-30 26"/><g fill="#111"><circle cx="275" cy="50" r="8"/><circle cx="307" cy="76" r="8"/><circle cx="339" cy="45" r="8"/><circle cx="285" cy="112" r="8"/><circle cx="331" cy="126" r="8"/><circle cx="362" cy="91" r="8"/><circle cx="390" cy="55" r="8"/></g></g>
  </g>
  <!-- visual key only: symbols -->
  <g transform="translate(320 500)"><path class="i" d="M0 45 H860"/><circle class="s" cx="80" cy="45" r="20"/><text class="t" x="210" y="60" font-size="42">R</text><text class="t" x="350" y="60" font-size="42">∂</text><text class="t" x="490" y="65" font-size="54">∫</text><text class="t" x="630" y="60" font-size="42">[ ]</text><text class="t" x="770" y="60" font-size="42">P</text></g>
</svg>
