<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Conditional probability exercise with overlapping events</title>
  <desc id="desc">A sample space contains nine equally likely points. Event A contains six points, event B contains four points, and their overlap contains two points. Blank probability expressions and an independence question appear to the right for students to complete.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <style>
      .set-label {
        fill: #17212b;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 72px;
        font-style: italic;
      }
      .math {
        fill: #17212b;
        font-family: "STIX Two Math", "Cambria Math", Georgia, serif;
        font-size: 52px;
      }
      .instruction {
        fill: #4b5563;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 25px;
      }
      .point {
        fill: #f36b3f;
        stroke: #d84723;
        stroke-width: 5;
      }
      .question {
        fill: #17212b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 31px;
        font-weight: 600;
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="38" y="35" width="625" height="565" rx="8" fill="#d1d3d6" stroke="#a7abb0" stroke-width="5"/>
  </g>

  <text x="63" y="105" class="set-label">S</text>

  <rect x="120" y="110" width="315" height="420" rx="3" fill="#41d79b" fill-opacity="0.78" stroke="#1ccf87" stroke-width="5"/>
  <rect x="345" y="270" width="295" height="260" rx="3" fill="#2ebbe7" fill-opacity="0.78" stroke="#08acd8" stroke-width="5"/>

  <text x="250" y="260" class="set-label">A</text>
  <text x="470" y="425" class="set-label">B</text>

  <g aria-label="nine equally likely outcomes">
    <circle class="point" cx="155" cy="150" r="16"/>
    <circle class="point" cx="380" cy="150" r="16"/>
    <circle class="point" cx="155" cy="315" r="16"/>
    <circle class="point" cx="390" cy="315" r="16"/>
    <circle class="point" cx="575" cy="315" r="16"/>
    <circle class="point" cx="390" cy="480" r="16"/>
    <circle class="point" cx="575" cy="480" r="16"/>
    <circle class="point" cx="575" cy="150" r="16"/>
    <circle class="point" cx="155" cy="480" r="16"/>
  </g>

  <text x="92" y="570" class="instruction">Each point is equally likely.</text>

  <text x="745" y="70" class="instruction">Complete each expression from the diagram:</text>

  <g class="math">
    <text x="760" y="145">ℙ(</text>
    <circle class="point" cx="823" cy="127" r="13"/>
    <text x="846" y="145">) =</text>

    <text x="760" y="225">ℙ(A) =</text>
    <text x="760" y="305">ℙ(B) =</text>
    <text x="760" y="385">ℙ(A ∩ B) =</text>

    <line x1="745" y1="425" x2="1345" y2="425" stroke="#c2c7ce" stroke-width="3"/>

    <text x="760" y="505">ℙ(A | B) =</text>
    <text x="760" y="585">ℙ(B | A) =</text>
  </g>

  <text x="760" y="635" class="question">Are events A and B independent?</text>
</svg>
